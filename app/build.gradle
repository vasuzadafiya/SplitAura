plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.splitaura'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.splitaura"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

//    in-built Dependency
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.viewpager2
    implementation libs.dotsindicator

//    Animation and UI Dependency
//    implementation libs.material.v170
    implementation libs.lottie
    implementation 'com.google.android.material:material:1.11.0'
//    implementation(libs.material.v1100)

//    Firebase Database Dependency
    implementation libs.firebase.storage
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.play.services.auth
    implementation libs.credentials.play.services.auth // Optional
    implementation libs.googleid // Optional
    implementation libs.credentials
    implementation libs.firebase.core
    implementation libs.firebase.database

    platform(libs.firebase.bom)
    implementation(libs.google.firebase.auth)
    implementation(libs.play.services.auth)
    implementation libs.fragment

}