plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.splitaura'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.splitaura"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

//    in-built Dependency
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.viewpager2
    implementation libs.dotsindicator

//    Animation and UI Dependency
    implementation libs.material.v170
    implementation libs.lottie

//    Firebase Database Dependency
    implementation libs.firebase.storage
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0' // Optional
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1' // Optional
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation libs.firebase.database

}