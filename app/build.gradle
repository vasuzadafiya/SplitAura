plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
    alias(libs.plugins.google.firebase.crashlytics)
}

android {
    namespace 'com.example.splitaura'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.splitaura"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

//    in-built Dependency
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.crashlytics
    implementation libs.gridlayout
    implementation libs.firebase.messaging
    implementation libs.navigation.runtime
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.viewpager2
    implementation libs.dotsindicator
    implementation libs.play.services.maps
    implementation 'com.google.android.gms:play-services-auth:20.7.0' // or latest version


//    Animation and UI Dependency
    implementation libs.lottie
    implementation 'com.google.android.material:material:1.12.0'

//    Firebase Database Dependency
    implementation libs.firebase.storage
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.play.services.auth
    implementation libs.credentials.play.services.auth // Optional
    implementation libs.googleid // Optional
    implementation libs.credentials
    implementation libs.firebase.core
    implementation libs.firebase.database
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'com.firebaseui:firebase-ui-firestore:8.0.2'
    implementation(libs.cloudinary.android.v302)


//    for picture processing
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    // for upi payment
    implementation 'com.razorpay:checkout:1.6.26'
    implementation 'com.itextpdf:itext7-core:7.2.5' // iText for PDF generation


    platform(libs.firebase.bom)
    implementation(libs.google.firebase.auth)
    implementation(libs.play.services.auth)
    implementation libs.fragment
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

//    image uploading api
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

//    chart api
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

}